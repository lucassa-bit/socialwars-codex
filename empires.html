<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Empires — Codex de tropas</title>
  <link rel="stylesheet" href="css/app.css?v=6">
</head>
<body data-game="empires">
  <header>
    <div class="site-bar">
      <a class="back" href="index.html">← Codex</a>
      <nav class="game-switch" aria-label="Jogo">
        <a href="wars.html">Wars</a>
        <a href="empires.html" aria-current="page">Empires</a>
      </nav>
      <nav class="game-nav" aria-label="Seção">
        <a href="empires.html" aria-current="page">Tropas</a>
        <a href="empires-fusion.html">Fusão</a>
      </nav>
    </div>
    <p class="sub" id="subtitle">Carregando catálogo…</p>
    <p id="file-warn">Abra com <code>python scripts/serve.py</code> — o navegador bloqueia o JSON em <code>file://</code>.</p>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Buscar por nome ou ID…" autocomplete="off">
      <button type="button" id="filter-toggle" aria-expanded="false" aria-controls="filters">Filtros</button>
      <label class="sort-wrap">
        Ordenar
        <select id="sort">
          <option value="order-desc">Order decrescente</option>
          <option value="order-asc">Order crescente</option>
          <option value="life-desc">Vida</option>
          <option value="attack-desc">Ataque</option>
          <option value="name">Nome</option>
          <option value="group">Grupo</option>
          <option value="pop-desc">População</option>
        </select>
      </label>
    </div>
    <div id="filters" hidden></div>
  </header>
  <main id="grid"></main>
  <div id="overlay">
    <div id="viewer">
      <header>
        <div>
          <h2 id="viewer-title"></h2>
          <p id="viewer-id"></p>
        </div>
        <button type="button" id="close">Fechar</button>
      </header>
      <div id="viewer-body">
        <div id="player"></div>
        <div>
          <div id="stats"></div>
          <div id="viewer-tags"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/app.js?v=6"></script>
</body>
</html>
