<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Wars — Codex de tropas</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-game="wars">
  <header>
    <p class="crumb"><a href="index.html">Codex</a></p>
    <h1>Tropas de Social Wars</h1>
    <nav class="game-nav">
      <a href="wars.html" aria-current="page">Tropas</a>
      <a href="fusion.html">Fusão</a>
    </nav>
    <p class="sub" id="subtitle">Carregando catálogo…</p>
    <p id="file-warn">Abra com <code>python scripts/serve.py</code> — o navegador bloqueia o JSON em <code>file://</code>.</p>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Buscar por nome ou ID…" autocomplete="off">
      <button type="button" id="filter-toggle" aria-expanded="false" aria-controls="filters">Filtros</button>
    </div>
    <div id="filters" hidden></div>
  </header>
  <main id="grid"></main>
  <div id="overlay">
    <div id="viewer">
      <header>
        <div>
          <h2 id="viewer-title"></h2>
          <p id="viewer-id"></p>
        </div>
        <button type="button" id="close">Fechar</button>
      </header>
      <div id="viewer-body">
        <div id="player"></div>
        <div>
          <div id="stats"></div>
          <div id="viewer-tags"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
